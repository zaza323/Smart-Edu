<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#18181b" />
    <meta name="description" content="بنك الأسئلة التفاعلي لطلاب التوجيهي — Smart Edu Pro" />
    <title>بنك الأسئلة | Smart Edu Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-base">
    <script>
      /* يُنفَّذ قبل رسم أي شيء: يمنع وميض اللون الخاطئ عند فتح الصفحة.
         الأولوية للاختيار اليدوي المحفوظ، وإلا تفضيل نظام التشغيل. */
      (function () {
        try {
          var saved = localStorage.getItem('sep_theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#faf8f3' : '#18181b');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
